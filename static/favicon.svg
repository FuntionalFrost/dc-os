<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Container / Dark Rack Faceplate -->
  <rect width="64" height="64" rx="14" fill="#0b0f19"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#1e293b" stroke-width="2"/>

  <!-- Upper Server Blade (Terminal Host) -->
  <rect x="12" y="13" width="40" height="16" rx="3" fill="#131c2d" stroke="#253549" stroke-width="2"/>
  
  <!-- Left & Right Rack Ears (Unit 1) -->
  <path d="M7 15h5v12H7a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2z" fill="#1a2536"/>
  <circle cx="8.5" cy="18" r="1.2" fill="#475569"/>
  <circle cx="8.5" cy="24" r="1.2" fill="#475569"/>

  <path d="M52 15h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-5v-12z" fill="#1a2536"/>
  <circle cx="55.5" cy="18" r="1.2" fill="#475569"/>
  <circle cx="55.5" cy="24" r="1.2" fill="#475569"/>

  <!-- Prompt (> _) -->
  <path d="M18 18l3.5 3-3.5 3" stroke="#86efac" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="24" x2="29" y2="24" stroke="#86efac" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Status LED (Online) -->
  <circle cx="45" cy="21" r="1.8" fill="#86efac"/>

  <!-- Lower Server Blade (Switch / Fiber Module) -->
  <rect x="12" y="35" width="40" height="16" rx="3" fill="#131c2d" stroke="#253549" stroke-width="2"/>

  <!-- Left & Right Rack Ears (Unit 2) -->
  <path d="M7 37h5v12H7a2 2 0 0 1-2-2V39a2 2 0 0 1 2-2z" fill="#1a2536"/>
  <circle cx="8.5" cy="40" r="1.2" fill="#475569"/>
  <circle cx="8.5" cy="46" r="1.2" fill="#475569"/>

  <path d="M52 37h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-5v-12z" fill="#1a2536"/>
  <circle cx="55.5" cy="40" r="1.2" fill="#475569"/>
  <circle cx="55.5" cy="46" r="1.2" fill="#475569"/>

  <!-- Port Sockets & Data Link LEDs -->
  <rect x="18" y="40" width="7" height="6" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="21.5" cy="43" r="1" fill="#38bdf8"/>
  
  <rect x="28" y="40" width="7" height="6" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="31.5" cy="43" r="1" fill="#38bdf8"/>

  <!-- Activity Indicator LED -->
  <circle cx="45" cy="43" r="1.8" fill="#f59e0b"/>
</svg>
